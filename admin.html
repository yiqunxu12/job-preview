function RoleBadge({role,t}){
  const colors={
    Admin:{bg:t.statusBlue,text:t.statusBlueText,border:t.statusBlueBorder},
    Manager:{bg:t.statusGreen,text:t.statusGreenText,border:t.statusGreenBorder},
    Recruiter:{bg:'rgba(168,85,247,0.15)',text:'#A855F7',border:'rgba(168,85,247,0.35)'},
    Viewer:{bg:t.pillBg,text:t.gray,border:t.pillBorder},
  };
  const c=colors[role]||colors.Viewer;
  return(<span style={{fontSize:11,fontWeight:700,color:c.text,background:c.bg,border:`1px solid ${c.border}`,borderRadius:50,padding:'3px 10px'}}>{role}</span>);
}

function EPAvatar({size,iconSize,teal,bg}){
  size=size||20;iconSize=iconSize||11;
  return(<div style={{width:size,height:size,borderRadius:'50%',background:bg,border:'1px solid '+teal+'33',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><svg width={iconSize} height={iconSize} viewBox="0 0 33 31" fill="none"><path d={MARK_PATH} fill={teal}/></svg></div>);
}
function FloatingChat({t}){
  const [open,setOpen]=React.useState(false);
  const [msgs,setMsgs]=React.useState([{role:'ai',text:"Hi! I'm Eddie. Ask me anything about your hiring pipeline or account."}]);
  const [inp,setInp]=React.useState('');
  const [typing,setTyping]=React.useState(false);
  const ref=React.useRef(null);
  function send(text){const msg=text||inp.trim();if(!msg)return;setMsgs(m=>[...m,{role:'user',text:msg}]);setInp('');setTyping(true);setTimeout(()=>{setTyping(false);setMsgs(m=>[...m,{role:'ai',text:"Got it. I have your hiring data loaded. 128 total applicants, 4 active jobs. What else can I help with?"}]);},1200);}
  React.useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[msgs,typing]);
  const fabStyle={position:'fixed',bottom:28,right:28,zIndex:300,display:'flex',alignItems:'center',gap:5,padding:'6px 11px 6px 7px',borderRadius:50,background:'linear-gradient(135deg,'+t.teal+','+t.tealDark+')',border:'none',cursor:'pointer',boxShadow:'0 3px 14px rgba(32,201,151,0.32)',fontSize:'10.5px',fontWeight:700,color:'#0A1214',fontFamily:'inherit'};
  if(!open)return(<button onClick={()=>setOpen(true)} style={fabStyle}><EPAvatar size={16} iconSize={8} teal={t.teal} bg="rgba(0,0,0,0.18)"/>Ask Eddie</button>);
  return(
    <div style={{position:'fixed',bottom:100,right:28,zIndex:400,width:360,height:480,background:t.card,border:'1px solid '+t.borderStrong,borderRadius:20,boxShadow:'0 8px 40px rgba(0,0,0,0.35)',display:'flex',flexDirection:'column',overflow:'hidden',animation:'fadeInScale .2s ease'}}>
      <div style={{padding:'12px 14px 10px',borderBottom:'1px solid '+t.border,display:'flex',alignItems:'center',justifyContent:'space-between',background:t.card}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}><EPAvatar size={26} iconSize={13} teal={t.teal} bg={t.tealIconBg}/><span style={{fontSize:14,fontWeight:700,color:t.text}}>Ask Eddie</span></div>
        <button onClick={()=>setOpen(false)} style={{width:26,height:26,borderRadius:'50%',background:t.tealIconBg,border:'1px solid '+t.border,color:t.teal,fontSize:14,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit'}}>-</button>
      </div>
      <div ref={ref} style={{flex:1,overflowY:'auto',padding:'14px 16px',display:'flex',flexDirection:'column',gap:12}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',gap:7,alignItems:'flex-start'}}>
            {m.role==='ai'&&<EPAvatar size={22} iconSize={11} teal={t.teal} bg={t.tealIconBg}/>}
            <div style={{maxWidth:'72%',background:m.role==='ai'?t.card:'rgba(32,201,151,0.22)',border:'0.67px solid '+(m.role==='ai'?t.border:t.borderStrong),borderRadius:m.role==='ai'?'3px 14px 14px 14px':'14px 14px 3px 14px',padding:'8px 11px',fontSize:13,lineHeight:1.6,color:t.textMid}}>{m.text}</div>
          </div>
        ))}
        {typing&&(<div style={{display:'flex',gap:7}}><EPAvatar size={22} iconSize={11} teal={t.teal} bg={t.tealIconBg}/><div style={{background:t.card,border:'0.67px solid '+t.border,borderRadius:'3px 14px 14px 14px',padding:'8px 11px',display:'flex',gap:3}}>{[0,.2,.4].map((d,i)=><div key={i} style={{width:5,height:5,borderRadius:'50%',background:t.teal}}/>)}</div></div>)}
      </div>
      <div style={{padding:'6px 12px 4px',borderTop:'1px solid '+t.border,display:'flex',gap:5,flexWrap:'wrap'}}>
        {['Pipeline summary','Draft email','Interview guide'].map(s=>(<button key={s} onClick={()=>send(s)} style={{padding:'3px 9px',borderRadius:50,background:t.tealIconBg,border:'1px solid '+t.border,color:t.teal,fontSize:11,cursor:'pointer',fontFamily:'inherit'}}>{s}</button>))}
      </div>
      <div style={{padding:'6px 12px 12px',borderTop:'1px solid '+t.border}}>
        <div style={{display:'flex',gap:8,alignItems:'center',background:t.inputBg,border:'1px solid '+t.inputBorder,borderRadius:18,padding:'7px 10px 7px 14px'}}>
          <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();send();}}} placeholder="Ask Eddie..." style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:13,color:t.text,fontFamily:'inherit'}}/>
          <button onClick={()=>send()} style={{width:28,height:28,borderRadius:'50%',border:'none',background:'linear-gradient(135deg,'+t.teal+','+t.tealDark+')',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}><svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="#0A1214" strokeWidth="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg></button>
        </div>
      </div>
    </div>
  );
}


function App(){
  const [isDark,setIsDark]=useState(true);
  const t=isDark?DARK:LIGHT;
  const [activeTab,setActiveTab]=useState('users');
  const [showDropdown,setShowDropdown]=useState(false);
  const [users,setUsers]=useState(INIT_USERS);
  const [inviteModal,setInviteModal]=useState(false);
  const [editUser,setEditUser]=useState(null);
  const [inviteForm,setInviteForm]=useState({email:'',name:'',role:'Recruiter'});
  const [inviteSent,setInviteSent]=useState(false);

  function handleInvite(){
    if(!inviteForm.email||!inviteForm.name) return;
    const initials=inviteForm.name.split(' ').map(n=>n[0]).join('').toUpperCase();
    setUsers(u=>[...u,{id:'u'+Date.now(),name:inviteForm.name,email:inviteForm.email,role:inviteForm.role,status:'Invited',lastActive:'Pending',initials}]);
    setInviteSent(true);
    setTimeout(()=>{setInviteModal(false);setInviteSent(false);setInviteForm({email:'',name:'',role:'Recruiter'});},1600);
  }

  function handleRoleChange(userId,newRole){
    setUsers(u=>u.map(user=>user.id===userId?{...user,role:newRole}:user));
    setEditUser(null);
  }

  function handleRemoveUser(userId){
    setUsers(u=>u.filter(user=>user.id!==userId));
    setEditUser(null);
  }

  const tabs=[{id:'users',label:'Team Members'},{id:'roles',label:'Roles & Permissions'},{id:'audit',label:'Audit Log'}];

  return(
    <div style={{fontFamily:'Inter,sans-serif',background:isDark?t.bg:`radial-gradient(ellipse at 50% 0%,rgba(15,165,136,0.05) 0%,#F0F6F5 60%)`,minHeight:'100vh',display:'flex',flexDirection:'column',color:t.text}}>

        <div style={{display:'flex',alignItems:'center',gap:3,flexShrink:0}}>
          <Logo isDark={isDark} height={32}/>
          <div style={{width:1,height:20,background:t.border,marginLeft:4}}/>
          <div style={{fontSize:11,fontWeight:600,color:t.teal,textTransform:'uppercase',letterSpacing:'1.5px',paddingLeft:6,whiteSpace:'nowrap'}}>EMPLOYER PORTAL</div>
        </div>
        <div style={{display:'flex',gap:2,background:t.pillBg,border:'1px solid '+t.pillBorder,borderRadius:50,padding:3}}>
          {[{id:'ask-eddie',label:'Ask Eddie',av:true},{id:'dashboard',label:'Dashboard',href:'dashboard.html'},{id:'applications',label:'Applications',href:'applications.html'},{id:'admin',label:'Admin Panel',active:true,href:'admin.html'}].map(item=>(
            <button key={item.id} onClick={item.href ? ()=>window.location.href=item.href : undefined} style={{padding:'7px 16px',borderRadius:50,fontSize:13,fontWeight:item.active?600:400,background:item.active?'linear-gradient(135deg,'+t.teal+','+t.tealDark+')':'transparent',border:'none',color:item.active?'#0A1214':t.gray,cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:6}} onMouseEnter={e=>{if(!item.active)e.currentTarget.style.color=t.textMid}} onMouseLeave={e=>{if(!item.active)e.currentTarget.style.color=t.gray}}>
              {item.av&&<EPAvatar size={18} iconSize={9} teal={item.active?'#0A1214':t.teal} bg={item.active?'rgba(0,0,0,0.18)':t.tealIconBg}/>}
              {item.label}
            </button>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0,position:'relative'}}>
          <div onClick={()=>setShowDropdown(!showDropdown)} style={{display:'flex',alignItems:'center',gap:8,background:isDark?'rgba(32,201,151,0.06)':'rgba(15,165,136,0.05)',border:'1px solid '+(showDropdown?t.borderStrong:t.border),borderRadius:50,padding:'5px 12px 5px 5px',cursor:'pointer'}}>

                <div key={item.label} style={{padding:'9px 14px',borderRadius:8,cursor:'pointer',fontSize:14,color:t.textMid,display:'flex',alignItems:'center',gap:10}} onMouseEnter={e=>e.currentTarget.style.background=t.tealIconBg} onMouseLeave={e=>e.currentTarget.style.background='transparent'}><span>{item.icon}</span>{item.label}</div>
              ))}
              <div style={{height:1,background:t.border,margin:'4px 0'}}/>
              <div style={{padding:'9px 14px',borderRadius:8,cursor:'pointer',fontSize:14,color:'#EF4444',display:'flex',alignItems:'center',gap:10}} onMouseEnter={e=>e.currentTarget.style.background='rgba(239,68,68,0.08)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}><span>🚪</span>Sign Out</div>
            </div>
          )}
          <button onClick={()=>setIsDark(!isDark)} style={{width:32,height:32,borderRadius:'50%',background:'transparent',border:'1px solid '+t.pillBorder,cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>{isDark?'🌙':'☀️'}</button>
        </div>
      </nav>

      <div style={{maxWidth:1100,margin:'0 auto',padding:'40px 24px 80px',animation:'fadeUp 0.4s ease both',flex:1}}>
        {/* Header */}
        <div style={{marginBottom:32}}>
          <div style={{fontSize:12,fontWeight:600,color:t.teal,textTransform:'uppercase',letterSpacing:'2px',marginBottom:12}}>ADMIN PANEL</div>
          <h1 style={{fontSize:32,fontWeight:800,margin:'0 0 8px',letterSpacing:'-0.5px',color:t.text}}>Team Management</h1>
          <p style={{fontSize:15,color:t.gray,margin:0}}>Manage team members, roles, and permissions for TechCorp Asia's employer portal.</p>
        </div>

        {/* Stats */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:16,marginBottom:32}}>
          {[
            {icon:'👥',label:'Total Members',value:users.length},
            {icon:'✅',label:'Active',value:users.filter(u=>u.status==='Active').length},
            {icon:'📧',label:'Invited (Pending)',value:users.filter(u=>u.status==='Invited').length},
            {icon:'🔑',label:'Admins',value:users.filter(u=>u.role==='Admin').length},
          ].map(({icon,label,value})=>(
            <div key={label} style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:14,padding:'16px 18px',display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:40,height:40,borderRadius:10,background:t.tealIconBg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>{icon}</div>
              <div>
                <div style={{fontSize:22,fontWeight:800,color:t.text}}>{value}</div>
                <div style={{fontSize:12,color:t.gray}}>{label}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:'flex',gap:4,background:t.pillBg,border:`1px solid ${t.pillBorder}`,borderRadius:50,padding:4,marginBottom:28,width:'fit-content'}}>
          {tabs.map(tab=>(
            <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
              style={{padding:'8px 20px',borderRadius:50,fontSize:13,fontWeight:activeTab===tab.id?600:400,
                background:activeTab===tab.id?`linear-gradient(135deg,${t.teal},${t.tealDark})`:'transparent',
                border:'none',color:activeTab===tab.id?'#0A1214':t.gray,cursor:'pointer',fontFamily:'inherit',transition:'all 0.2s'}}>
              {tab.label}
            </button>
          ))}
        </div>

        {/* TEAM MEMBERS TAB */}
        {activeTab==='users'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:700,color:t.text}}>{users.length} team members</div>
              <button onClick={()=>setInviteModal(true)}
                style={{padding:'10px 22px',borderRadius:50,background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,border:'none',color:'#0A1214',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
                + Invite Member
              </button>
            </div>
            <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:16,overflow:'hidden'}}>
              <table style={{width:'100%',borderCollapse:'collapse'}}>
                <thead>
                  <tr style={{borderBottom:`1px solid ${t.border}`,background:t.pillBg}}>
                    {['Member','Role','Status','Last Active','Created Reqs','Open Reqs','Actions'].map(h=>(
                      <th key={h} style={{padding:'12px 16px',fontSize:11,fontWeight:600,color:t.gray,textAlign:'left',textTransform:'uppercase',letterSpacing:'0.8px'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {users.map((user,i)=>(
                    <tr key={user.id} style={{borderBottom:i<users.length-1?`1px solid ${t.border}`:'none',transition:'background 0.15s'}}
                      onMouseEnter={e=>e.currentTarget.style.background=t.tealIconBg}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <td style={{padding:'14px 16px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:10}}>
                          <div style={{width:36,height:36,borderRadius:'50%',background:user.role==='Admin'?`linear-gradient(135deg,${t.teal},${t.tealDark})`:t.pillBg,
                            border:`1px solid ${user.role==='Admin'?t.borderStrong:t.pillBorder}`,
                            display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700,
                            color:user.role==='Admin'?'#0A1214':t.gray,flexShrink:0}}>{user.initials}</div>
                          <div>
                            <div style={{fontSize:14,fontWeight:600,color:t.text}}>{user.name}</div>
                            <div style={{fontSize:12,color:t.gray}}>{user.email}</div>
                          </div>
                        </div>
                      </td>
                      <td style={{padding:'14px 16px'}}><RoleBadge role={user.role} t={t}/></td>
                      <td style={{padding:'14px 16px'}}>
                        <span style={{fontSize:11,fontWeight:600,
                          color:user.status==='Active'?t.statusGreenText:t.statusYellowText,
                          background:user.status==='Active'?t.statusGreen:t.statusYellow,
                          border:`1px solid ${user.status==='Active'?t.statusGreenBorder:t.statusYellowBorder}`,
                          borderRadius:50,padding:'3px 10px'}}>{user.status}</span>
                      </td>
                      <td style={{padding:'14px 16px',fontSize:13,color:t.gray}}>{user.lastActive}</td>
                      <td style={{padding:'14px 16px',fontSize:13,color:t.text,fontWeight:600,textAlign:'center'}}>
                        {user.status==='Invited'?<span style={{color:t.grayDim}}>—</span>:user.createdReqs}
                      </td>
                      <td style={{padding:'14px 16px',fontSize:13,textAlign:'center'}}>
                        {user.status==='Invited'?<span style={{color:t.grayDim}}>—</span>:(
                          <span style={{color:user.openReqs>0?t.teal:t.gray,fontWeight:user.openReqs>0?700:400}}>{user.openReqs}</span>
                        )}
                      </td>
                      <td style={{padding:'14px 16px'}}>
                        {user.role!=='Admin'&&(
                          <div style={{display:'flex',gap:8}}>
                            <button onClick={()=>setEditUser(user)}
                              style={{padding:'6px 12px',borderRadius:50,background:'transparent',border:`1px solid ${t.border}`,color:t.teal,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Edit Role</button>
                            <button onClick={()=>handleRemoveUser(user.id)}
                              style={{padding:'6px 12px',borderRadius:50,background:'transparent',border:'1px solid rgba(239,68,68,0.30)',color:'#EF4444',fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Remove</button>
                          </div>
                        )}
                        {user.role==='Admin'&&<span style={{fontSize:12,color:t.grayDim}}>Account Owner</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* ROLES & PERMISSIONS TAB */}
        {activeTab==='roles'&&(
          <div>
            <div style={{fontSize:15,color:t.gray,marginBottom:24,lineHeight:1.65}}>
              Define what each role can do in the Employer Portal. Permissions apply to all team members with that role.
            </div>
            <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:16,overflow:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',minWidth:700}}>
                <thead>
                  <tr style={{borderBottom:`1px solid ${t.border}`}}>
                    <th style={{padding:'16px 20px',fontSize:13,fontWeight:600,color:t.text,textAlign:'left',width:220}}>Permission</th>
                    {ROLES.map(role=>(
                      <th key={role} style={{padding:'16px 12px',fontSize:12,fontWeight:600,textAlign:'center'}}>
                        <RoleBadge role={role} t={t}/>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {PERM_LABELS.map(({key,label},i)=>(
                    <tr key={key} style={{borderBottom:i<PERM_LABELS.length-1?`1px solid ${t.border}`:'none'}}>
                      <td style={{padding:'14px 20px',fontSize:14,color:t.textMid}}>{label}</td>
                      {ROLES.map(role=>(
                        <td key={role} style={{padding:'14px 12px',textAlign:'center'}}>
                          {ROLE_PERMS[role][key]?(
                            <div style={{width:22,height:22,borderRadius:'50%',background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,
                              display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto',fontSize:11,fontWeight:700,color:'#0A1214'}}>✓</div>
                          ):(
                            <div style={{width:22,height:22,borderRadius:'50%',background:t.pillBg,border:`1px solid ${t.pillBorder}`,
                              display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto',fontSize:11,color:t.grayDim}}>−</div>
                          )}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:16,fontSize:13,color:t.grayDim}}>💡 Role permissions are currently fixed. Custom role configuration is available on Enterprise plans.</div>
          </div>
        )}

        {/* AUDIT LOG TAB */}
        {activeTab==='audit'&&(
          <div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:700,color:t.text}}>Audit Log</div>
              <button style={{padding:'8px 18px',borderRadius:50,background:'transparent',border:`1px solid ${t.border}`,color:t.teal,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>Export Log</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {AUDIT_LOG.map(log=>{
                const c=AUDIT_TYPE_COLOR[log.type]||AUDIT_TYPE_COLOR.status;
                return(
                  <div key={log.id} style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'flex-start',gap:12,
                    transition:'border-color 0.15s'}}
                    onMouseEnter={e=>e.currentTarget.style.borderColor=t.borderStrong}
                    onMouseLeave={e=>e.currentTarget.style.borderColor=t.border}>
                    <div style={{width:8,height:8,borderRadius:'50%',background:c.text,flexShrink:0,marginTop:5}}/>
                    <div style={{flex:1}}>
                      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:4}}>
                        <span style={{fontSize:14,fontWeight:600,color:t.text}}>{log.actor}</span>
                        <span style={{fontSize:11,fontWeight:700,color:c.text,background:c.bg,border:`1px solid ${c.border}`,borderRadius:50,padding:'2px 8px',textTransform:'uppercase'}}>{log.type}</span>
                      </div>
                      <div style={{fontSize:13,color:t.textMid}}>{log.action}</div>
                      <div style={{fontSize:11,color:t.grayDim,marginTop:4}}>🕐 {log.time}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      {/* INVITE MODAL */}
      {inviteModal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div style={{background:t.card,border:`1px solid ${t.borderStrong}`,borderRadius:20,padding:32,maxWidth:440,width:'100%',animation:'fadeUp 0.3s ease both'}}>
            {inviteSent?(
              <div style={{textAlign:'center',padding:'20px 0'}}>
                <div style={{fontSize:40,marginBottom:12}}>✉️</div>
                <div style={{fontSize:18,fontWeight:700,color:t.text,marginBottom:8}}>Invitation Sent!</div>
                <div style={{fontSize:14,color:t.gray}}>Invite sent to {inviteForm.email}.</div>
              </div>
            ):(
              <>
                <div style={{fontSize:18,fontWeight:700,color:t.text,marginBottom:6}}>Invite Team Member</div>
                <div style={{fontSize:14,color:t.gray,marginBottom:24}}>They'll receive an email invitation to join TechCorp's portal.</div>
                {[{label:'Full Name',key:'name',placeholder:'Jane Smith',type:'text'},{label:'Work Email',key:'email',placeholder:'jane@techcorp.asia',type:'email'}].map(({label,key,placeholder,type})=>(
                  <div key={key} style={{marginBottom:16}}>
                    <label style={{display:'block',fontSize:13,fontWeight:600,color:t.textMid,marginBottom:6}}>{label}</label>
                    <input type={type} value={inviteForm[key]} onChange={e=>setInviteForm(f=>({...f,[key]:e.target.value}))} placeholder={placeholder}
                      style={{width:'100%',padding:'11px 14px',background:t.inputBg,border:`1px solid ${t.inputBorder}`,borderRadius:10,fontSize:15,color:t.text,fontFamily:'inherit',outline:'none'}}/>
                  </div>
                ))}
                <div style={{marginBottom:24}}>
                  <label style={{display:'block',fontSize:13,fontWeight:600,color:t.textMid,marginBottom:6}}>Role</label>
                  <select value={inviteForm.role} onChange={e=>setInviteForm(f=>({...f,role:e.target.value}))}
                    style={{width:'100%',padding:'11px 14px',background:t.inputBg,border:`1px solid ${t.inputBorder}`,borderRadius:10,fontSize:15,color:t.text,fontFamily:'inherit',outline:'none',cursor:'pointer'}}>
                    {ROLES.filter(r=>r!=='Admin').map(r=><option key={r} value={r} style={{background:t.card}}>{r}</option>)}
                  </select>
                  <div style={{fontSize:12,color:t.gray,marginTop:4}}>
                    {ROLE_PERMS[inviteForm.role]?`Can ${ROLE_PERMS[inviteForm.role].postJobs?'post jobs':'view only'}, ${ROLE_PERMS[inviteForm.role].reviewApplicants?'review applicants':''}, ${ROLE_PERMS[inviteForm.role].sendEmails?'send emails':''}`:''}
                  </div>
                </div>
                <div style={{display:'flex',gap:10}}>
                  <button onClick={handleInvite}
                    style={{flex:1,padding:'12px',borderRadius:50,background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,border:'none',color:'#0A1214',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Send Invitation</button>
                  <button onClick={()=>setInviteModal(false)}
                    style={{flex:1,padding:'12px',borderRadius:50,background:'transparent',border:`1px solid ${t.border}`,color:t.textMid,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* EDIT ROLE MODAL */}
      {editUser&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
          <div style={{background:t.card,border:`1px solid ${t.borderStrong}`,borderRadius:20,padding:32,maxWidth:380,width:'100%',animation:'fadeUp 0.3s ease both'}}>
            <div style={{fontSize:18,fontWeight:700,color:t.text,marginBottom:4}}>Change Role</div>
            <div style={{fontSize:14,color:t.gray,marginBottom:24}}>Update role for <strong style={{color:t.textMid}}>{editUser.name}</strong></div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
              {ROLES.filter(r=>r!=='Admin').map(role=>(
                <div key={role} onClick={()=>handleRoleChange(editUser.id,role)}
                  style={{padding:'12px 16px',borderRadius:12,cursor:'pointer',
                    background:editUser.role===role?t.tealIconBg:'transparent',
                    border:`1px solid ${editUser.role===role?t.borderStrong:t.border}`,transition:'all 0.15s'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <RoleBadge role={role} t={t}/>
                      <div style={{fontSize:12,color:t.gray,marginTop:4}}>
                        {role==='Manager'?'Post & edit jobs, review applicants, view billing':
                         role==='Recruiter'?'Post jobs, review applicants, send emails':
                         'View-only access to applicant pipeline'}
                      </div>
                    </div>
                    {editUser.role===role&&<span style={{fontSize:14,color:t.teal}}>✓</span>}
                  </div>
                </div>
              ))}
            </div>
            <button onClick={()=>setEditUser(null)}
              style={{width:'100%',padding:'12px',borderRadius:50,background:'transparent',border:`1px solid ${t.border}`,color:t.textMid,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
          </div>
        </div>
      )}
          <FloatingChat t={t}/>

      {/* Site Footer */}
      <footer style={{borderTop:`0.67px solid ${t.border}`,padding:'16px 24px',display:'flex',
        flexDirection:'column',alignItems:'center',justifyContent:'space-between',gap:12}}>
        <span style={{fontSize:13,color:t.grayDim}}>
          © 2026 EduPolaris AI. All rights reserved.
        </span>
        <div style={{display:'flex',gap:16}}>
          <a href="https://edupolaris.ai/assets/docs/EduPolaris_AI_Privacy_Policy_03112025.html"
             target="_blank" rel="noopener noreferrer"
             style={{fontSize:13,color:t.gray,textDecoration:'none',transition:'color 0.2s'}}
         onMouseEnter={e=>e.target.style.color=t.teal}
             onMouseLeave={e=>e.target.style.color=t.gray}>
            Privacy Policy
        </a>
          <a href="mailto:help@eddiejobs.ai"
             style={{fontSize:13,color:t.gray,textDecoration:'none',transition:'color 0.2s'}}
             onMouseEnter={e=>e.target.style.color=t.teal}
             onMouseLeave={e=>e.target.style.color=t.gray}>
          Contact
        </a>
        </div>
      </footer>
</div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
