function Badge({label,type,t}){
  const map={
    green:{bg:t.sGreenBg,c:t.sGreen},orange:{bg:t.sOrangeBg,c:t.sOrange},
    red:{bg:t.sRedBg,c:t.sRed},blue:{bg:t.sBlueBg,c:t.sBlue},
    gray:{bg:t.sGrayBg,c:t.sGray},teal:{bg:t.tealIconBg,c:t.teal},
  };
  const s=map[type]||map.gray;
  return(
    <span style={{display:'inline-flex',alignItems:'center',padding:'3px 10px',borderRadius:'50px',fontSize:'11px',fontWeight:'600',background:s.bg,color:s.c,whiteSpace:'nowrap'}}>{label}</span>

function StageBar({client,t}){
  const stages=[{k:'workshops',l:'Workshops'},{k:'vocational',l:'Vocational'},{k:'certification',l:'Certs'},{k:'placement',l:'Placement'}];
  const gc=s=>s==='complete'?t.sGreen:s==='in_progress'?t.sOrange:t.grayDim;
  const gb=s=>s==='complete'?t.sGreenBg:s==='in_progress'?t.sOrangeBg:t.sGrayBg;
  const gi=s=>s==='complete'?'✓':s==='in_progress'?'●':'○';
  return(
    <div style={{display:'flex',gap:'4px',flexWrap:'wrap'}}>
      {stages.map((s,i)=>{
        const st=client[s.k];
        return(
          <React.Fragment key={s.k}>
            <div style={{display:'flex',alignItems:'center',gap:'4px',padding:'3px 8px',borderRadius:'50px',background:gb(st),border:`1px solid ${gc(st)}22`,fontSize:'11px',fontWeight:'600',color:gc(st),whiteSpace:'nowrap'}}>
              <span style={{fontSize:'9px'}}>{gi(st)}</span>{s.l}
            </div>
            {i<stages.length-1&&<div style={{display:'flex',alignItems:'center'}}><div style={{width:'8px',height:'1px',background:t.border}}/></div>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function PlacementProgress({status,t}){
  const stages=['Matched','Submitted','Interviewed','Placed'];
  const closed=status==='Closed';
  const ci=closed?-1:stages.indexOf(status);
  return(
    <div style={{display:'flex',alignItems:'flex-start'}}>
      {stages.map((stage,i)=>{
        const done=!closed&&i<ci;
        const cur=!closed&&i===ci;
        const dc=done?t.sGreen:cur?t.teal:t.grayDim;
        const db=done?t.sGreenBg:cur?t.tealIconBg:t.sGrayBg;
        const di=done?'✓':cur?'●':'';
        return(
          <React.Fragment key={stage}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',minWidth:'56px'}}>
              <div style={{width:'22px',height:'22px',borderRadius:'50%',background:db,border:`2px solid ${dc}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'10px',color:dc,fontWeight:'700'}}>{di}</div>
              <div style={{fontSize:'9px',color:dc,fontWeight:cur?'700':'400',textAlign:'center',whiteSpace:'nowrap'}}>{stage}</div>
            </div>
            {i<stages.length-1&&<div style={{flex:1,height:'2px',marginTop:'10px',background:done?t.sGreen:t.border,minWidth:'12px'}}/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

// v4 FIX #3: Floating Chat Window — overlays current module; minimize collapses to FAB
function FloatingChat({t,onClose}){
  const [msgs,setMsgs]=useState([{id:1,role:'ai',text:"Hi Brenda! I'm Eddie. How can I help with your caseload today?"}]);
  const [inp,setInp]=useState('');
  const [typing,setTyping]=useState(false);
  const [focused,setFocused]=useState(false);
  const endRef=useRef(null);
  // drag state
  const dragRef=useRef(null);
  const [pos,setPos]=useState({bottom:100,right:28});
  const dragging=useRef(false);
  const dragStart=useRef({mx:0,my:0,b:100,r:28});

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,typing]);

  const onDragStart=(e)=>{
    dragging.current=true;
    dragStart.current={mx:e.clientX,my:e.clientY,b:pos.bottom,r:pos.right};
    e.preventDefault();
  };
  const onDragMove=(e)=>{
    if(!dragging.current)return;
    const dx=e.clientX-dragStart.current.mx;
    const dy=e.clientY-dragStart.current.my;
    setPos({bottom:Math.max(8,dragStart.current.b-dy),right:Math.max(8,dragStart.current.r-dx)});
  };
  const onDragEnd=()=>{dragging.current=false;};
  useEffect(()=>{
    window.addEventListener('mousemove',onDragMove);
    window.addEventListener('mouseup',onDragEnd);
    return()=>{
      window.removeEventListener('mousemove',onDragMove);
      window.removeEventListener('mouseup',onDragEnd);
    };
  },[pos]);

  const send=useCallback((text)=>{
    if(!text.trim())return;
    setMsgs(p=>[...p,{id:Date.now(),role:'user',text:text.trim()}]);
    setInp('');setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      const r=AI_RESPONSES[text.trim()]||`I understand you're asking about: **"${text.trim()}"**\n\nI can help with caseload management, employer follow-ups, and outreach.`;
      setMsgs(p=>[...p,{id:Date.now()+1,role:'ai',text:r}]);
    },1200+Math.random()*700);
  },[]);

  const rt=(text)=>text.split('\n').map((line,i,a)=>{
    const parts=line.split(/(\*\*[^*]+\*\*)/g);
    return(<React.Fragment key={i}>{parts.map((p,j)=>p.startsWith('**')&&p.endsWith('**')?<strong key={j}>{p.slice(2,-2)}</strong>:<span key={j}>{p}</span>)}{i<a.length-1&&<br/>}</React.Fragment>);
  });

  const suggestions=["Who's at risk this week?","Draft outreach for Melissa Tran","Show employer follow-ups"];

  return(
    <div
      ref={dragRef}
      className="modal-in"
      style={{
        position:'fixed',bottom:`${pos.bottom}px`,right:`${pos.right}px`,zIndex:400,
        width:'360px',height:'480px',
        background:t.card,border:`1px solid ${t.borderStrong}`,
        borderRadius:'20px',boxShadow:`0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px ${t.border}`,
        display:'flex',flexDirection:'column',overflow:'hidden',
      }}
    >
      {/* Header — drag handle */}
      <div
        onMouseDown={onDragStart}
        style={{
          padding:'12px 14px 10px',
          background:t.chatBg,
          borderBottom:`1px solid ${t.border}`,
          display:'flex',alignItems:'center',justifyContent:'space-between',
          cursor:'grab',flexShrink:0,userSelect:'none',
        }}
      >
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <EPAvatar size={26} iconSize={13} teal={t.teal} bg={t.tealIconBg}/>
          <div style={{fontSize:'14px',fontWeight:'700',color:t.text}}>Ask Eddie</div>
          <div style={{width:'6px',height:'6px',borderRadius:'50%',background:t.teal,opacity:.85}}/>
        </div>
        <div style={{display:'flex',gap:'6px'}}>
          {/* Minimize */}
          <button
            onClick={onClose}
            title="Minimize"
            style={{width:'26px',height:'26px',borderRadius:'50%',background:t.tealIconBg,border:`1px solid ${t.border}`,color:t.teal,cursor:'pointer',fontSize:'14px',display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1}}
          >−</button>
        </div>
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'14px 16px',background:t.chatBg}}>
        {msgs.map(m=>(
          <div key={m.id} className="fade-in" style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:'12px',gap:'7px',alignItems:'flex-start'}}>
            {m.role==='ai'&&<EPAvatar size={22} iconSize={11} teal={t.teal} bg={t.tealIconBg}/>}
            <div style={{maxWidth:'72%',background:m.role==='user'?`linear-gradient(135deg,${t.teal22},${t.tealDark11})`:t.card,border:`0.67px solid ${m.role==='user'?t.borderStrong:t.border}`,borderRadius:m.role==='user'?'14px 14px 3px 14px':'3px 14px 14px 14px',padding:'8px 11px',fontSize:'13px',lineHeight:'1.6',color:t.text}}>
              {rt(m.text)}
            </div>
          </div>
        ))}
        {typing&&(
          <div className="fade-in" style={{display:'flex',gap:'7px',alignItems:'flex-start',marginBottom:'12px'}}>
            <EPAvatar size={22} iconSize={11} teal={t.teal} bg={t.tealIconBg}/>
            <div style={{background:t.card,border:`0.67px solid ${t.border}`,borderRadius:'3px 14px 14px 14px',padding:'10px 13px',display:'flex',gap:'4px',alignItems:'center'}}>
              {[0,.2,.4].map((d,i)=><div key={i} style={{width:'6px',height:'6px',borderRadius:'50%',background:t.teal,animation:`typingBounce 1.2s ease infinite`,animationDelay:`${d}s`}}/>)}
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>

      {/* Suggestions */}
      <div style={{padding:'6px 12px 4px',background:t.chatBg,display:'flex',gap:'5px',flexWrap:'wrap',borderTop:`1px solid ${t.border}`}}>
        {suggestions.map((s,i)=>(
          <button key={i} onClick={()=>send(s)} style={{padding:'3px 9px',borderRadius:'50px',fontSize:'11px',background:t.tealIconBg,border:`1px solid ${t.border}`,color:t.teal,cursor:'pointer',whiteSpace:'nowrap',transition:'all .15s'}}>{s}</button>
        ))}
      </div>

      {/* Input */}
      <div style={{padding:'6px 12px 12px',background:t.chatBg,flexShrink:0}}>
        <div style={{background:t.inputBg,border:`1px solid ${focused?t.inputBorderFocus:t.inputBorder}`,borderRadius:'18px',padding:'7px 10px 7px 14px',display:'flex',alignItems:'center',gap:'6px',transition:'all .2s ease',boxShadow:focused?`0 0 0 3px rgba(32,201,151,0.08)`:'none'}}>
          <textarea value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(inp);}}} onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)} placeholder="Ask Eddie…" rows={1} style={{flex:1,fontSize:'13px',lineHeight:'1.4',color:t.text,background:'transparent',maxHeight:'80px',overflow:'auto'}}/>
          <button onClick={()=>send(inp)} disabled={!inp.trim()} style={{width:'28px',height:'28px',borderRadius:'50%',flexShrink:0,background:inp.trim()?`linear-gradient(135deg,${t.teal},${t.tealDark})`:t.pillBg,border:'none',cursor:inp.trim()?'pointer':'default',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .2s ease'}}>

// ── Ask Eddie Module ─────────────────────────────────────────────────────────────
function ChatModule({t}){
  const [msgs,setMsgs]=useState([{id:1,role:'ai',text:"Hi Brenda! I'm Eddie, your AI counseling assistant. I can help you manage your caseload, review client progress, draft outreach messages, check employer status, and prepare reports.\n\nYou have **3 high-priority items** today — 2 clients at risk and 1 employer follow-up overdue. Want me to walk you through them?"}]);
  const [inp,setInp]=useState('');
  const [typing,setTyping]=useState(false);
  const [focused,setFocused]=useState(false);
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,typing]);

  const send=useCallback((text)=>{
    if(!text.trim())return;
    setMsgs(p=>[...p,{id:Date.now(),role:'user',text:text.trim()}]);
    setInp('');setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      const r=AI_RESPONSES[text.trim()]||`I understand you're asking about: **"${text.trim()}"**\n\nI can help with client caseload management, employer follow-ups, reporting, and outreach. Try asking about specific clients or employers.`;
      setMsgs(p=>[...p,{id:Date.now()+1,role:'ai',text:r}]);
    },1400+Math.random()*800);
  },[]);

  const rt=(text)=>text.split('\n').map((line,i,a)=>{
    const parts=line.split(/(\*\*[^*]+\*\*)/g);
    return(<React.Fragment key={i}>{parts.map((p,j)=>p.startsWith('**')&&p.endsWith('**')?<strong key={j}>{p.slice(2,-2)}</strong>:<span key={j}>{p}</span>)}{i<a.length-1&&<br/>}</React.Fragment>);
  });

  const suggestions=["Which clients are at risk of dropping out this week?","Show me employer matches for James Okafor","Draft a re-engagement message for Melissa Tran","What's my Q2 retention completion rate?","Which employers haven't responded in over 5 days?"];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div style={{padding:'18px 28px 14px',borderBottom:`1px solid ${t.border}`,flexShrink:0,background:t.chatBg}}>
        <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
          {/* v4 FIX #1: EPAvatar — neutral bg, teal mark */}
          <EPAvatar size={36} iconSize={19} teal={t.teal} bg={t.tealIconBg}/>
          <div style={{fontSize:'16px',fontWeight:'700',color:t.text}}>Ask Eddie</div>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'20px 28px',background:t.chatBg}}>
        {msgs.map(m=>(
          <div key={m.id} className="fade-in" style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',marginBottom:'16px',gap:'10px',alignItems:'flex-start'}}>
            {m.role==='ai'&&<EPAvatar size={28} iconSize={14} teal={t.teal} bg={t.tealIconBg}/>}
            <div style={{maxWidth:'68%',background:m.role==='user'?`linear-gradient(135deg,${t.teal22},${t.tealDark11})`:t.card,border:`0.67px solid ${m.role==='user'?t.borderStrong:t.border}`,borderRadius:m.role==='user'?'18px 18px 4px 18px':'4px 18px 18px 18px',padding:'11px 15px',fontSize:'14px',lineHeight:'1.65',color:t.text}}>
              {rt(m.text)}
            </div>
          </div>
        ))}
        {typing&&(
          <div className="fade-in" style={{display:'flex',gap:'10px',alignItems:'flex-start',marginBottom:'16px'}}>
            <EPAvatar size={28} iconSize={14} teal={t.teal} bg={t.tealIconBg}/>
            <div style={{background:t.card,border:`0.67px solid ${t.border}`,borderRadius:'4px 18px 18px 18px',padding:'13px 16px',display:'flex',gap:'5px',alignItems:'center'}}>
              {[0,.2,.4].map((d,i)=><div key={i} style={{width:'7px',height:'7px',borderRadius:'50%',background:t.teal,animation:`typingBounce 1.2s ease infinite`,animationDelay:`${d}s`}}/>)}
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>
      <div style={{padding:'8px 28px 6px',background:t.chatBg,display:'flex',gap:'6px',flexWrap:'wrap'}}>
        {suggestions.map((s,i)=>(
          <button key={i} onClick={()=>send(s)} style={{padding:'5px 12px',borderRadius:'50px',fontSize:'12px',background:t.tealIconBg,border:`1px solid ${t.border}`,color:t.teal,cursor:'pointer',transition:'all .15s',whiteSpace:'nowrap'}}
            onMouseEnter={e=>{e.target.style.background=t.tealIconBg;e.target.style.color=t.text;e.target.style.borderColor=t.borderStrong;}}
            onMouseLeave={e=>{e.target.style.background=t.tealIconBg;e.target.style.color=t.teal;e.target.style.borderColor=t.border;}}
          >{s}</button>
        ))}
      </div>
      <div style={{padding:'8px 28px 20px',background:t.chatBg,flexShrink:0}}>
        <div style={{background:t.inputBg,border:`1px solid ${focused?t.inputBorderFocus:t.inputBorder}`,borderRadius:'22px',padding:'10px 12px 10px 18px',display:'flex',alignItems:'center',gap:'8px',transition:'all .2s ease',boxShadow:focused?`0 0 0 3px rgba(32,201,151,0.08)`:'none'}}>

                {sel.potentialCandidates.map((cand,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 12px',background:t.bgSubtle,borderRadius:'10px'}}>
                    <div style={{width:'30px',height:'30px',borderRadius:'50%',background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'700',color:'#0A1214',flexShrink:0}}>{cand.initials}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:'13px',fontWeight:'600',color:t.text}}>{cand.name}</div>
                      <div style={{fontSize:'11px',color:t.gray}}>{cand.track} · {cand.note}</div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontSize:'15px',fontWeight:'700',color:t.teal}}>{cand.score}%</div>
                      <div style={{fontSize:'10px',color:t.grayDim}}>match</div>
                    </div>
                    <button style={{padding:'5px 12px',borderRadius:'50px',fontSize:'11px',fontWeight:'600',background:t.tealIconBg,border:`1px solid ${t.border}`,color:t.teal,cursor:'pointer',whiteSpace:'nowrap'}}>Refer</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Open Positions */}
          <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:'10px',padding:'14px',marginBottom:'14px'}}>
            <div style={{fontSize:'11px',fontWeight:'600',color:t.teal,textTransform:'uppercase',letterSpacing:'1.2px',marginBottom:'10px'}}>All Open Positions</div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {sel.roles.map((role,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',color:t.textMid}}>
                  <div style={{width:'6px',height:'6px',borderRadius:'50%',background:t.teal,flexShrink:0}}/>
                  {role}
                </div>
              ))}
            </div>
          </div>

          <button style={{width:'100%',padding:'11px 20px',borderRadius:'50px',fontSize:'13px',fontWeight:'600',background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,border:'none',color:'#0A1214',cursor:'pointer'}}>✉️ Send Message</button>
        </div>
      )}


    </div>
  );
}

// ── App Root ─────────────────────────────────────────────────────────────────────
function App(){
  const [isDark,setIsDark]=useState(true);
  const [active,setActive]=useState('chat');
  // v4 FIX #3: Floating chat state managed at App level
  const [chatOpen,setChatOpen]=useState(false);
  const t=isDark?DARK:LIGHT;
  const openFloatingChat=()=>setChatOpen(true);

  const navItems=[
    {k:'dashboard',l:'Dashboard',badge:0},
    {k:'clients',l:'Client Cases',badge:0},
    {k:'employers',l:'Employers',badge:0},
  ];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:t.bg,fontFamily:"'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",color:t.text}}>

      {/* ── Top Navigation Bar ─────────────────────────────────────────────────── */}
      <div style={{height:'60px',flexShrink:0,background:t.navBg,backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)',borderBottom:`0.67px solid ${t.border}`,display:'flex',alignItems:'center',padding:'0 24px',gap:'8px',zIndex:100}}>
        {/* v4 FIX #2: Header gap fix — reduced gap from 8px to 3px, removed divider marginLeft */}
        <div style={{flexShrink:0,display:'flex',alignItems:'center',gap:'3px',marginRight:'8px'}}>
          <Logo isDark={isDark} height={34}/>
          <div style={{width:'1px',height:'20px',background:t.border}}/>
          <div style={{fontSize:'11px',fontWeight:'600',color:t.teal,textTransform:'uppercase',letterSpacing:'1.5px',whiteSpace:'nowrap',paddingLeft:'2px'}}>Counselor Portal</div>
        </div>

        {/* Nav Links — center */}
        <div style={{display:'flex',alignItems:'center',gap:'2px',flex:1,justifyContent:'center'}}>
          {navItems.map(item=>{
            const isActive=active===item.k;
            return(
              <button key={item.k} onClick={()=>setActive(item.k)} style={{display:'flex',alignItems:'center',gap:'7px',padding:'7px 14px',borderRadius:'10px',background:isActive?`linear-gradient(135deg,${t.teal}20,${t.tealDark}10)`:'transparent',border:`1px solid ${isActive?t.borderStrong:'transparent'}`,color:isActive?t.teal:t.gray,cursor:'pointer',transition:'all .15s ease',fontSize:'14px',fontWeight:isActive?'600':'400',whiteSpace:'nowrap'}}
                onMouseEnter={e=>{if(!isActive){e.currentTarget.style.background=t.tealIconBg;e.currentTarget.style.color=t.textMid;}}}
                onMouseLeave={e=>{if(!isActive){e.currentTarget.style.background='transparent';e.currentTarget.style.color=t.gray;}}}
              >
                {/* v4 FIX #1: Nav Eddie avatar — neutral bg, teal mark */}
                {item.isEddie?(
                  <EPAvatar size={20} iconSize={11} teal={t.teal} bg={t.tealIconBg}/>
                ):null}
                {item.l}
                {item.badge>0&&(
                  <span style={{background:item.k==='dashboard'?t.sRedBg:t.sOrangeBg,color:item.k==='dashboard'?t.sRed:t.sOrange,fontSize:'10px',fontWeight:'700',padding:'1px 6px',borderRadius:'50px',minWidth:'18px',textAlign:'center'}}>{item.badge}</span>
                )}
              </button>
            );
          })}
        </div>

        {/* Right: Account pill + Theme toggle */}
        <div style={{display:'flex',alignItems:'center',gap:'10px',flexShrink:0}}>
          {/* v3 FIX #2: Account avatar uses t.teal gradient — consistent in both themes */}
          <button style={{display:'flex',alignItems:'center',gap:'8px',padding:'5px 12px 5px 5px',borderRadius:'50px',background:isDark?'rgba(32,201,151,0.06)':'rgba(15,165,136,0.05)',border:`1px solid ${t.border}`,cursor:'pointer',transition:'all .2s ease'}}
            onMouseEnter={e=>{e.currentTarget.style.background=isDark?'rgba(32,201,151,0.10)':'rgba(15,165,136,0.08)';e.currentTarget.style.borderColor=t.borderStrong;}}
            onMouseLeave={e=>{e.currentTarget.style.background=isDark?'rgba(32,201,151,0.06)':'rgba(15,165,136,0.05)';e.currentTarget.style.borderColor=t.border;}}
          >
            <div style={{width:'28px',height:'28px',borderRadius:'50%',background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',fontWeight:'700',color:'#0A1214',letterSpacing:'0.3px'}}>BC</div>
            <div style={{fontSize:'13px',fontWeight:'600',color:t.text,whiteSpace:'nowrap'}}>Brenda C.</div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style={{opacity:.5}}>
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke={t.teal} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          {/* Theme toggle */}
          <button onClick={()=>setIsDark(!isDark)} title={isDark?'Switch to light theme':'Switch to dark theme'} style={{width:'36px',height:'36px',borderRadius:'50%',background:'transparent',border:`1px solid ${t.pillBorder}`,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px',lineHeight:1,transition:'all .2s ease',flexShrink:0}}
            onMouseEnter={e=>{e.currentTarget.style.background=t.tealIconBg;e.currentTarget.style.borderColor=t.tealDim;}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.borderColor=t.pillBorder;}}
          >{isDark?'🌙':'☀️'}</button>
        </div>
      </div>

      {/* ── Module Content ──────────────────────────────────────────────────────── */}
      <div style={{flex:1,overflow:'hidden'}}>

        {active==='dashboard'&&<DashboardModule t={t} onNavigate={setActive} onOpenChat={openFloatingChat}/>}
        {active==='clients'&&<ClientsModule t={t} onNavigate={setActive} onOpenChat={openFloatingChat}/>}
        {active==='employers'&&<EmployersModule t={t} onNavigate={setActive} onOpenChat={openFloatingChat}/>}
      </div>

      {/* v4 FIX #3: Floating chat window — rendered at App level, available on all modules */}
      {chatOpen&&<FloatingChat t={t} onClose={()=>setChatOpen(false)}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
