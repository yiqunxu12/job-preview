function getWorkflowCounts(jobId){
  const jobApplicants=APPLICANTS.filter(a=>a.jobId===jobId);
  const counts={submitted:0,reviewed:0,screened:0,interviewed:0,offered:0,closed:0};
  jobApplicants.forEach(a=>{counts[a.stage]=(counts[a.stage]||0)+1;});
  return counts;
}

function getTotalApplicants(jobId){ return APPLICANTS.filter(a=>a.jobId===jobId).length; }
function getActiveApplicants(jobId){
  return APPLICANTS.filter(a=>a.jobId===jobId && a.stage!=='closed').length;
}

// ── STATUS BADGE ──
function StatusBadge({status,t}){
  let bg,color,border;
  if(status==='Active'){bg=t.statusTeal;color=t.statusTealText;border=t.statusTealBorder;}
  else if(status==='Paused'){bg=t.statusYellow;color=t.statusYellowText;border=t.statusYellowBorder;}
  else if(status==='Closed'){bg=t.statusRed;color=t.statusRedText;border=t.statusRedBorder;}
  else{bg=t.pillBg;color=t.gray;border=t.pillBorder;}
  return(
    <span style={{display:'inline-flex',alignItems:'center',fontSize:10,fontWeight:700,
      color,background:bg,border:`1px solid ${border}`,borderRadius:50,padding:'2px 8px',whiteSpace:'nowrap'}}>
      {status}
    </span>
  );
}

// ── STAGE BADGE (applicant pipeline stage label) ──
function StageBadge({stage,t}){
  const stageInfo=PIPELINE_STAGES.find(s=>s.key===stage);
  const label=stageInfo?stageInfo.label:stage;
  let bg,color,border;
  if(stage==='submitted'){bg=t.statusBlue;color=t.statusBlueText;border=t.statusBlueBorder;}
  else if(stage==='reviewed'){bg=t.pillBg;color=t.gray;border=t.pillBorder;}
  else if(stage==='screened'){bg=t.statusYellow;color=t.statusYellowText;border=t.statusYellowBorder;}
  else if(stage==='interviewed'){bg=t.statusTeal;color=t.statusTealText;border=t.statusTealBorder;}
  else if(stage==='offered'){bg=t.statusGreen;color=t.statusGreenText;border=t.statusGreenBorder;}
  else if(stage==='closed'){bg=t.statusRed;color=t.statusRedText;border=t.statusRedBorder;}
  else{bg=t.pillBg;color=t.gray;border=t.pillBorder;}
  return(
    <span style={{display:'inline-flex',alignItems:'center',fontSize:10,fontWeight:700,
      color,background:bg,border:`1px solid ${border}`,borderRadius:50,padding:'2px 8px',whiteSpace:'nowrap'}}>
      {label}
    </span>
  );
}

// ── r5: HORIZONTAL PIPELINE TRACKER (NON-CROSSING FIX) ──
// FIX: Each stage slot has position:relative. Connector lines are split into
// LEFT half (0 → 50%-R-GAP) and RIGHT half (50%+R+GAP → 100%) as absolutely
// positioned divs WITHIN each slot. Lines never reach the circle because
// they stop at circleRadius + GAP before center. Pattern: ◯ [gap] ─── [gap] ◯
//
function HorizontalPipelineTracker({mode='job',workflow={},activeStage=null,t,compact=false}){
  const activeIdx = PIPELINE_STAGES.findIndex(s=>s.key===activeStage);
  const circleR = compact ? 9 : 11;       // radius in px
  const circleD = circleR * 2;            // diameter
  const GAP = 3;                          // gap between line end and circle edge (px)
  const inactiveCircle='rgba(100,116,139,0.35)';
  const inactiveLabel='#5C6B73';

  return(
    <div style={{width:'100%',padding:compact?'4px 0 0':'6px 0 0'}}>

      {/* ── TRACKER ROW: circles + connecting lines ── */}
      <div style={{display:'flex',alignItems:'center',width:'100%',height:circleD}}>
        {PIPELINE_STAGES.map((s,i)=>{
          const isFirst = i === 0;
          const isLast  = i === PIPELINE_STAGES.length - 1;
          const isActive    = mode==='applicant' && s.key===activeStage;
          const isCompleted = mode==='applicant' && activeIdx > i;
          const isFuture    = mode==='applicant' && activeIdx < i;
          const isFutureLine = mode==='applicant' && activeIdx <= i;

          // Circle appearance
          let circleStyle={};
          let dotContent=null;

          if(mode==='job'){
            circleStyle={
              width:circleD,height:circleD,borderRadius:'50%',
              border:`2px solid ${t.teal}`,background:'transparent',
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
            };
            dotContent=<div style={{width:compact?6:8,height:compact?6:8,borderRadius:'50%',background:t.teal}}/>;
          } else if(mode==='applicant'){
            if(isCompleted){
              circleStyle={
                width:circleD,height:circleD,borderRadius:'50%',
                border:`2px solid ${t.teal}`,background:t.tealIconBg,
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
              };
              dotContent=<span style={{fontSize:compact?7:9,fontWeight:700,color:t.teal}}>&#10003;</span>;
            } else if(isActive){
              circleStyle={
                width:circleD,height:circleD,borderRadius:'50%',
                border:`2.5px solid ${t.teal}`,background:'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
                boxShadow:`0 0 0 3px rgba(32,201,151,0.15)`,
              };
              dotContent=<div style={{width:compact?7:9,height:compact?7:9,borderRadius:'50%',background:t.teal}}/>;
            } else {
              circleStyle={
                width:circleD,height:circleD,borderRadius:'50%',
                border:`1.5px solid ${inactiveCircle}`,background:'transparent',
                display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
              };
              dotContent=null;
            }
          }

          const lineColor = isFutureLine
            ? 'rgba(100,116,139,0.20)'
            : 'rgba(32,201,151,0.30)';

          // Each slot is flex:1 with position:relative.
          // Left half-line: from left edge of slot to (circle center - circleR - GAP)
          //   i.e. width = "50% - circleR - GAP", positioned at left:0
          // Right half-line: from (circle center + circleR + GAP) to right edge
          //   i.e. left = "50% + circleR + GAP px", width = "calc(50% - ${circleR+GAP}px)"
          // Circle: centered with margin:auto (or absolute center)
          const halfLineH = 2; // line height in px

          return(
            <div key={s.key} style={{
              flex:1,
              position:'relative',
              display:'flex',
              alignItems:'center',
              justifyContent:'center',
              height:circleD,
            }}>
              {/* LEFT half-connector — drawn for all stages except first */}
              {!isFirst && (
                <div style={{
                  position:'absolute',
                  left:0,
                  top:'50%',
                  transform:'translateY(-50%)',
                  width:`calc(50% - ${circleR + GAP}px)`,
                  height:halfLineH,
                  background:lineColor,
                  borderRadius:1,
                }}/>
              )}

              {/* Circle — centered in slot */}
              <div style={{...circleStyle,position:'relative',zIndex:1}}>
                {dotContent}
              </div>

              {/* RIGHT half-connector — drawn for all stages except last */}
              {!isLast && (
                <div style={{
                  position:'absolute',
                  left:`calc(50% + ${circleR + GAP}px)`,
                  top:'50%',
                  transform:'translateY(-50%)',
                  width:`calc(50% - ${circleR + GAP}px)`,
                  height:halfLineH,
                  background:isFutureLine
                    ? 'rgba(100,116,139,0.20)'
                    : 'rgba(32,201,151,0.30)',
                  borderRadius:1,
                }}/>
              )}
            </div>
          );
        })}
      </div>

      {/* ── LABELS ROW ── */}
      <div style={{display:'flex',width:'100%',marginTop:compact?3:4}}>
        {PIPELINE_STAGES.map((s,i)=>{
          const isFuture = mode==='applicant' && activeIdx < i;
          return(
            <div key={s.key} style={{
              flex:1,
              display:'flex',
              flexDirection:'column',
              alignItems:'center',
              gap:compact?1:2,
            }}>
              <div style={{
                fontSize:compact?8:9,fontWeight:700,
                color:mode==='applicant'&&isFuture?inactiveLabel:t.teal,
                textAlign:'center',whiteSpace:'nowrap',lineHeight:1.2,
              }}>
                {s.shortLabel}
              </div>
              {mode==='job'&&(
                <div style={{
                  fontSize:compact?9:10,fontWeight:700,
                  color:(workflow[s.key]||0)>0?t.teal:t.grayDim,
                  lineHeight:1,
                }}>
                  {workflow[s.key]||0}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

    const statusColors={
      Accepted:{bg:t.statusGreen,text:t.statusGreenText,border:t.statusGreenBorder},
      Rejected:{bg:t.statusRed,text:t.statusRedText,border:t.statusRedBorder},
      Withdrawn:{bg:t.statusYellow,text:t.statusYellowText,border:t.statusYellowBorder},
      Cancelled:{bg:t.statusBlue,text:t.statusBlueText,border:t.statusBlueBorder},
    };
    const sc=statusColors[data?.finalStatus]||statusColors.Rejected;
    content=(
      <div style={{padding:22}}>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:600,color:t.gray,marginBottom:8}}>FINAL STATUS</div>
          <Badge label={data?.finalStatus||'Unknown'} color={sc.text} bg={sc.bg} border={sc.border}/>
        </div>
        {data?.note&&(
          <div>
            <div style={{fontSize:12,fontWeight:600,color:t.gray,marginBottom:6}}>Notes</div>
            <div style={{background:t.card2,border:`1px solid ${t.border}`,borderRadius:10,padding:'12px 14px',
              fontSize:13,color:t.textMid}}>{data.note}</div>
          </div>
        )}
      </div>
    );
  }

  return(
    <Modal onClose={onClose} t={t} title={`${applicant.name} — ${stageLabel}`} width={580} footer={confirmBtn}>
      {!data?(
        <div style={{padding:40,textAlign:'center',color:t.gray}}>
          <div style={{fontSize:40,marginBottom:12}}>📭</div>
          <div style={{fontSize:14}}>No data available for this stage yet.</div>
        </div>
      ):content}
    </Modal>
  );
}

// ── FLOATING CHAT ──
function FloatingChat({t}){
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([{role:'ai',text:"Hi! I'm Eddie. I can help you review candidates, draft communications, or analyze your pipeline. What do you need?"}]);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const ref=useRef(null);

  function send(text){
    const msg=text||input.trim();if(!msg)return;
    setMsgs(m=>[...m,{role:'user',text:msg}]);
    setInput('');setTyping(true);
    setTimeout(()=>{setTyping(false);setMsgs(m=>[...m,{role:'ai',text:"I've analyzed your current applications. The Senior Frontend Engineer role has 7 candidates, with 1 at the offer stage. Phone screen with Sarah Chen (94% match) is recommended next. Want me to draft the interview guide?"}]);},1200);

  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[msgs,typing]);

// ── MAIN APP ──
function App(){
  const [isDark,setIsDark]=useState(true);
  const t=isDark?DARK:LIGHT;
  const [selectedJobId,setSelectedJobId]=useState(1);
  const [activeStageFilter,setActiveStageFilter]=useState(null);
  const [selectedApplicant,setSelectedApplicant]=useState(null);
  const [stepModal,setStepModal]=useState(null);
  const [jobDescModal,setJobDescModal]=useState(null);
  const [postJobModal,setPostJobModal]=useState(false);
  const [showDropdown,setShowDropdown]=useState(false);
  const [applicantStages,setApplicantStages]=useState({});

  function advanceApplicantStage(applicantId,currentStageKey){
    const currentIdx=PIPELINE_STAGES.findIndex(s=>s.key===currentStageKey);
    if(currentIdx>=0&&currentIdx<PIPELINE_STAGES.length-1){
      const nextStageKey=PIPELINE_STAGES[currentIdx+1].key;
      setApplicantStages(prev=>({...prev,[applicantId]:nextStageKey}));
      setSelectedApplicant(prev=>prev&&prev.id===applicantId?{...prev,stage:nextStageKey}:prev);
    }

  const selectedJob=JOBS.find(j=>j.id===selectedJobId)||JOBS[0];

  const filteredApplicants=activeStageFilter
    ?jobApplicants.filter(a=>a.stage===activeStageFilter)

              {item.hasAvatar&&(
                <EPAvatar size={18} iconSize={9}
                  teal={item.active?'#0A1214':t.teal}
                  bg={item.active?'rgba(0,0,0,0.18)':t.tealIconBg}/>
              )}
              {item.label}
            </button>
          ))}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0,position:'relative'}}>
          <div onClick={e=>{e.stopPropagation();setShowDropdown(!showDropdown);}}
            style={{display:'flex',alignItems:'center',gap:8,background:isDark?'rgba(32,201,151,0.06)':'rgba(15,165,136,0.05)',
              border:`1px solid ${showDropdown?t.borderStrong:t.border}`,borderRadius:50,
              padding:'5px 12px 5px 5px',cursor:'pointer',transition:'all 0.2s'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#0A1214'}}>TC</div>
            <span style={{fontSize:14,fontWeight:600,color:t.text}}>TechCorp</span>
            <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke={t.teal} strokeWidth="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </div>
          {showDropdown&&(
            <div style={{position:'absolute',top:46,right:36,background:t.dropdownBg,border:`1px solid ${t.border}`,
              borderRadius:14,padding:8,minWidth:180,boxShadow:t.dropdownShadow,zIndex:200}}
              onClick={e=>e.stopPropagation()}>
              {[{label:'Profile',icon:'👤'},{label:'Subscription',icon:'💳'}].map(item=>(
                <div key={item.label} style={{padding:'9px 14px',borderRadius:8,cursor:'pointer',fontSize:14,
                  color:t.textMid,display:'flex',alignItems:'center',gap:10}}
                  onMouseEnter={e=>e.currentTarget.style.background=t.tealIconBg}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <span>{item.icon}</span>{item.label}
                </div>
              ))}
              <div style={{height:1,background:t.border,margin:'4px 0'}}/>
              <div style={{padding:'9px 14px',borderRadius:8,cursor:'pointer',fontSize:14,color:t.statusRedText,display:'flex',alignItems:'center',gap:10}}
                onMouseEnter={e=>e.currentTarget.style.background=t.statusRed}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <span>🚪</span>Sign Out
              </div>
            </div>
          )}
          <button onClick={()=>setIsDark(!isDark)}
            style={{width:32,height:32,borderRadius:'50%',background:'transparent',
              border:`1px solid ${t.pillBorder}`,cursor:'pointer',fontSize:14,
              display:'flex',alignItems:'center',justifyContent:'center'}}>
            {isDark?'🌙':'☀️'}
          </button>
        </div>
      </nav>

      {/* THREE-PANEL LAYOUT */}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>

        {/* ─────────── LEFT PANEL: Job List ─────────── */}
        <div style={{width:280,flexShrink:0,borderRight:`1px solid ${t.border}`,overflowY:'auto',padding:12,background:t.bgSubtle||t.card2}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:600,color:t.gray,textTransform:'uppercase',letterSpacing:'1px'}}>Job Postings</div>
          </div>
          <button onClick={()=>setPostJobModal(true)}
            style={{width:'100%',padding:'9px 12px',marginBottom:12,borderRadius:10,
              background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,border:'none',
              color:'#0A1214',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>+ Post New Job</button>

          {JOBS.map(job=>(
            <JobCard
              key={job.id}
              job={job}
              isSelected={selectedJobId===job.id}
              onSelect={()=>{setSelectedJobId(job.id);setActiveStageFilter(null);setSelectedApplicant(null);}}
              onViewDesc={setJobDescModal}
              isDark={isDark}
              t={t}
            />
          ))}
        </div>

        {/* ─────────── CENTER PANEL ─────────── */}
        <div style={{flex:1,minWidth:0,borderRight:`1px solid ${t.border}`,display:'flex',flexDirection:'column',overflow:'hidden'}}>

          {/* ── Job Header ── */}
          <div style={{padding:'14px 16px 12px',borderBottom:`1px solid ${t.border}`,flexShrink:0,background:t.card2||t.bgSubtle}}>
            <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:6}}>
              <div style={{flex:1,minWidth:0,marginRight:10}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
                  <div style={{fontSize:15,fontWeight:700,color:t.text,cursor:'pointer',
                    textDecorationLine:'underline',textDecorationColor:`${t.teal}44`}}
                    onClick={()=>setJobDescModal(selectedJob)}>
                    {selectedJob.title}
                  </div>
                  <StatusBadge status={selectedJob.status} t={t}/>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                  <span style={{fontSize:11,color:t.gray}}>📅 {selectedJob.posted}</span>
                  <span style={{fontSize:10,color:t.grayDim}}>·</span>
                  <span style={{fontSize:11,color:t.gray}}>{daysActive} days active</span>
                  <span style={{fontSize:10,color:t.grayDim}}>·</span>
                  <span style={{fontSize:11,color:t.gray}}>by <span style={{color:t.teal,fontWeight:600}}>{selectedJob.createdBy}</span></span>
                  <span style={{fontSize:10,color:t.grayDim}}>·</span>
                  <span style={{fontSize:11,color:t.teal,fontWeight:600}}>{totalApplicants} applicants</span>
                  <span style={{fontSize:10,color:t.grayDim}}>·</span>
                  <span style={{fontSize:11,color:t.statusGreenText,fontWeight:600}}>{activeApplicants} active</span>
                  {activeStageFilter&&(
                    <button onClick={()=>setActiveStageFilter(null)}
                      style={{padding:'2px 8px',borderRadius:50,background:t.statusYellow,border:`1px solid ${t.statusYellowBorder}`,
                        color:t.statusYellowText,fontSize:10,cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>
                      Clear ×
                    </button>
                  )}
                </div>
              </div>
            </div>

            {/* ── Job Pipeline Overview (non-crossing tracker) ── */}
            <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:'10px 14px',marginTop:8}}>
              <div style={{fontSize:10,fontWeight:600,color:t.gray,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:4}}>Pipeline Overview</div>
              <HorizontalPipelineTracker mode="job" workflow={workflow} t={t} compact={false}/>
            </div>
          </div>

          {/* ── Applicant Cards ── */}
          <div style={{flex:1,overflowY:'auto',padding:'12px'}}>
            {filteredApplicants.length===0?(
              <div style={{textAlign:'center',padding:'60px 20px'}}>
                <div style={{fontSize:40,marginBottom:12}}>📭</div>
                <div style={{fontSize:14,fontWeight:600,color:t.text,marginBottom:4}}>
                  {activeStageFilter?`No applicants in ${PIPELINE_STAGES.find(s=>s.key===activeStageFilter)?.label} stage`:'No applicants yet'}
                </div>
                <div style={{fontSize:13,color:t.gray}}>
                  {activeStageFilter?'Try another stage filter or clear the filter.':'Applications will appear here once candidates apply.'}
                </div>
              </div>
            ):(
              <div>
                {filteredApplicants.map(a=>(
                  <ApplicantCard
                    key={a.id}
                    applicant={a}
                    isSelected={selectedApplicant?.id===a.id}
                    onSelect={()=>setSelectedApplicant(a)}
                    onStepClick={(applicant,stage)=>setStepModal({applicant,stage})}
                    t={t}
                  />
                ))}
              </div>
            )}
          </div>
        </div>

        {/* ─────────── RIGHT PANEL: Applicant Detail ─────────── */}
        <div style={{width:300,flexShrink:0,overflowY:'auto',background:t.bgSubtle||t.card2}}>
          <ApplicantDetail
            applicant={selectedApplicant}
            onStepClick={(applicant,stage)=>setStepModal({applicant,stage})}
            t={t}
          />
        </div>
      </div>

      {/* FLOATING CHAT */}
      <FloatingChat t={t}/>

      {/* MODALS */}
      {stepModal&&(
        <StepDetailModal
          applicant={stepModal.applicant}
          stage={stepModal.stage}
          onClose={()=>setStepModal(null)}
          t={t}
          onAdvanceStage={advanceApplicantStage}
        />
      )}
      {jobDescModal&&(
        <JobDescModal job={jobDescModal} onClose={()=>setJobDescModal(null)} t={t}/>
      )}
      {postJobModal&&(
        <PostJobModal
          onClose={()=>setPostJobModal(false)}
          onPost={(form)=>console.log('New job:', form)}
          t={t}
        />
      )}

      {/* Site Footer */}
      <footer style={{borderTop:`0.67px solid ${t.border}`,padding:'16px 24px',display:'flex',
        flexDirection:'column',alignItems:'center',justifyContent:'space-between',gap:12}}>
        <span style={{fontSize:13,color:t.grayDim}}>
          © 2026 EduPolaris AI. All rights reserved.
        </span>
        <div style={{display:'flex',gap:16}}>
     <a href="https://edupolaris.ai/assets/docs/EduPolaris_AI_Privacy_Policy_03112025.html"
             target="_blank" rel="noopener noreferrer"
          style={{fontSize:13,color:t.gray,textDecoration:'none',transition:'color 0.2s'}}
             onMouseEnter={e=>e.target.style.color=t.teal}
             onMouseLeave={e=>e.target.style.color=t.gray}>
            Privacy Policy
        </a>
          <a href="mailto:help@eddiejobs.ai"
             style={{fontSize:13,color:t.gray,textDecoration:'none',transition:'color 0.2s'}}
           onMouseEnter={e=>e.target.style.color=t.teal}
             onMouseLeave={e=>e.target.style.color=t.gray}>
            Contact
          </a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
