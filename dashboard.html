function computeDaysActive(postedDate){
  const today = new Date('2026-05-05');
  const d = new Date(postedDate);
  return Math.max(0, Math.floor((today - d)/(1000*60*60*24)));
}

function Badge({label,color,bg,border}){
  return(<span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,
    color,background:bg,border:`1px solid ${border}`,borderRadius:50,padding:'3px 10px',whiteSpace:'nowrap'}}>{label}</span>);
}

function StatusBadge({status,t}){
  let bg,color,border;
  if(status==='Active'){bg=t.statusTeal;color=t.statusTealText;border=t.statusTealBorder;}
  else if(status==='Paused'){bg=t.statusYellow;color=t.statusYellowText;border=t.statusYellowBorder;}
  else if(status==='Closed'){bg=t.statusRed;color=t.statusRedText;border=t.statusRedBorder;}
  else{bg=t.pillBg;color=t.gray;border=t.pillBorder;}
  return(
    <span style={{display:'inline-flex',alignItems:'center',fontSize:11,fontWeight:700,
      color,background:bg,border:`1px solid ${border}`,borderRadius:50,padding:'3px 10px',whiteSpace:'nowrap'}}>
      {status}
    </span>
  );
}

// ── HORIZONTAL PIPELINE TRACKER (from r5 — non-crossing circle-gap-line-gap-circle pattern) ──
// Each stage slot: position:relative, flex:1
// LEFT half-line: left:0 → calc(50% - circleR - GAP)
// RIGHT half-line: calc(50% + circleR + GAP) → right edge
// Circle: centered with z-index:1 so it sits on top of lines
function HorizontalPipelineTracker({workflow={},t,compact=false}){
  const circleR = compact ? 9 : 11;
  const circleD = circleR * 2;
  const GAP = 3;
  const halfLineH = 2;

  return(
    <div style={{width:'100%',padding:compact?'4px 0 0':'6px 0 0'}}>
      {/* Tracker row: circles + connecting lines */}
      <div style={{display:'flex',alignItems:'center',width:'100%',height:circleD}}>
        {PIPELINE_STAGES.map((s,i)=>{
          const isFirst = i === 0;
          const isLast  = i === PIPELINE_STAGES.length - 1;
          const count = workflow[s.key] || 0;
          const hasApplicants = count > 0;

          const circleStyle={
            width:circleD,height:circleD,borderRadius:'50%',
            border:`2px solid ${hasApplicants ? t.teal : 'rgba(100,116,139,0.35)'}`,
            background: hasApplicants ? t.tealIconBg : 'transparent',
            display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,
            position:'relative',zIndex:1,
          };

          return(
            <div key={s.key} style={{
              flex:1,
              position:'relative',
              display:'flex',
              alignItems:'center',
              justifyContent:'center',
              height:circleD,
            }}>
              {/* LEFT half-connector */}
              {!isFirst && (
                <div style={{
                  position:'absolute',
                  left:0,
                  top:'50%',
                  transform:'translateY(-50%)',
                  width:`calc(50% - ${circleR + GAP}px)`,
                  height:halfLineH,
                  background:'rgba(32,201,151,0.30)',
                  borderRadius:1,
                }}/>
              )}
              {/* Circle */}
              <div style={circleStyle}>
                {hasApplicants && (
                  <div style={{width:compact?6:8,height:compact?6:8,borderRadius:'50%',background:t.teal}}/>
                )}
              </div>
              {/* RIGHT half-connector */}
              {!isLast && (
                <div style={{
                  position:'absolute',
                  left:`calc(50% + ${circleR + GAP}px)`,
                  top:'50%',
                  transform:'translateY(-50%)',
                  width:`calc(50% - ${circleR + GAP}px)`,
                  height:halfLineH,
                  background:'rgba(32,201,151,0.30)',
                  borderRadius:1,
                }}/>
              )}
            </div>
          );
        })}
      </div>

      {/* Labels row */}
      <div style={{display:'flex',width:'100%',marginTop:compact?3:4}}>
        {PIPELINE_STAGES.map((s)=>{
          const count = workflow[s.key] || 0;
          return(
            <div key={s.key} style={{
              flex:1,
              display:'flex',
              flexDirection:'column',
              alignItems:'center',
              gap:compact?1:2,
            }}>
              <div style={{
                fontSize:compact?8:9,fontWeight:700,
                color:t.teal,
                textAlign:'center',whiteSpace:'nowrap',lineHeight:1.2,
              }}>
                {s.shortLabel}
              </div>
              <div style={{
                fontSize:compact?9:10,fontWeight:700,
                color:count>0?t.teal:t.grayDim,
                lineHeight:1,
              }}>
                {count}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    const msg=text||input.trim();if(!msg)return;

        <div>

        {messages.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',gap:10,alignItems:'flex-start',animation:'fadeUp 0.3s ease both'}}>
            {m.role==='ai'&&<EPAvatar size={28} iconSize={13} teal={t.teal} bg={t.tealIconBg}/>}
            <div style={{maxWidth:'78%',background:m.role==='ai'?t.card:`linear-gradient(135deg,${t.teal22},${t.tealDark11})`,

            <div style={{background:t.card,border:`0.67px solid ${t.border}`,borderRadius:'4px 18px 18px 18px',padding:'12px 18px',display:'flex',gap:4,alignItems:'center'}}>

    high:{bg:t.statusYellow,text:t.statusYellowText,border:t.statusYellowBorder},
    medium:{bg:t.statusBlue,text:t.statusBlueText,border:t.statusBlueBorder},
  };
  const activeJobs = JOBS.filter(j=>j.status==='Active');
  const allJobs = JOBS;

  return(
    <div style={{padding:'24px',overflowY:'auto',height:'100%'}}>
      {/* Metrics */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16,marginBottom:28}}>

          <div key={i} style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:14,padding:'16px 18px'}}>

            <div style={{fontSize:28,fontWeight:800,color:t.text,letterSpacing:'-0.5px',marginBottom:4}}>{m.value}</div>

      <div style={{marginBottom:28}}>

          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{fontSize:16,fontWeight:700,color:t.text}}>Urgent Tasks</div>
            <div style={{background:t.statusRed,border:`1px solid ${t.statusRedBorder}`,color:t.statusRedText,
              fontSize:11,fontWeight:700,borderRadius:50,padding:'2px 8px'}}>{URGENT_TASKS.length}</div>

                <div style={{fontSize:22,flexShrink:0}}>{task.icon}</div>
                <div style={{flex:1,minWidth:0}}>

                    <span style={{fontSize:11,fontWeight:600,color:c.text,background:c.bg,border:`1px solid ${c.border}`,
                      borderRadius:50,padding:'2px 8px',textTransform:'uppercase',letterSpacing:'0.5px'}}>{task.priority}</span>
                  </div>
                  <div style={{fontSize:13,color:t.gray}}>{task.desc}</div>
                  <div style={{fontSize:11,color:t.grayDim,marginTop:2}}>{'\uD83D\uDCCC'} {task.job}</div>
                </div>
                <button style={{background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,border:'none',
                  borderRadius:50,padding:'8px 16px',color:'#0A1214',fontSize:12,fontWeight:600,

// ── FLOATING CHAT ──
function FloatingChat({t}){
  const [open,setOpen]=useState(false);
  const [msgs,setMsgs]=useState([{role:'ai',text:"Hi! I'm Eddie. Ask me anything about your hiring pipeline — candidates, interviews, offers, or pipeline insights."}]);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const ref=useRef(null);

  function send(text){
    const msg=text||input.trim();
    if(!msg)return;
    setMsgs(m=>[...m,{role:'user',text:msg}]);
    setInput('');setTyping(true);
    setTimeout(()=>{setTyping(false);setMsgs(m=>[...m,{role:'ai',text:"I've reviewed your current pipeline. You have 128 total applicants across 5 active roles. Yuki Tanaka's offer expires in 48 hours — want me to draft a follow-up? Sarah Chen is ready to advance from interview stage."}]);},1300);
  }

  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[msgs,typing]);

  if(!open) return(
    <button onClick={()=>setOpen(true)}
      style={{position:'fixed',bottom:28,right:28,zIndex:300,display:'flex',alignItems:'center',gap:5,
        padding:'6px 11px 6px 7px',borderRadius:50,
        background:`linear-gradient(135deg,${t.teal},${t.tealDark})`,
        border:'none',cursor:'pointer',
        boxShadow:'0 3px 14px rgba(32,201,151,0.32),0 1px 5px rgba(0,0,0,0.18)',
        fontSize:'10.5px',fontWeight:700,color:'#0A1214',transition:'all .2s',fontFamily:'inherit'}}>
      <EPAvatar size={16} iconSize={8} teal={t.teal} bg="rgba(0,0,0,0.18)"/>
      Ask Eddie
    </button>
  );

  return(
    <div style={{position:'fixed',bottom:100,right:28,zIndex:400,width:360,height:480,
      background:t.card,border:`1px solid ${t.borderStrong}`,borderRadius:20,
      boxShadow:'0 8px 40px rgba(0,0,0,0.35)',display:'flex',flexDirection:'column',overflow:'hidden',
      animation:'fadeInScale .2s ease'}}>
      {/* Header */}
      <div style={{padding:'12px 14px 10px',borderBottom:`1px solid ${t.border}`,
        display:'flex',alignItems:'center',justifyContent:'space-between',background:t.card2||t.card}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <EPAvatar size={26} iconSize={13} teal={t.teal} bg={t.tealIconBg}/>
          <span style={{fontSize:14,fontWeight:700,color:t.text}}>Ask Eddie</span>
          <div style={{width:6,height:6,borderRadius:'50%',background:t.teal,opacity:.85}}/>
        </div>
        <button onClick={()=>setOpen(false)}
          style={{width:26,height:26,borderRadius:'50%',background:t.tealIconBg,
            border:`1px solid ${t.border}`,color:t.teal,fontSize:14,cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'inherit'}}>&#8722;</button>
      </div>
      {/* Messages */}
      <div ref={ref} style={{flex:1,overflowY:'auto',padding:'14px 16px',display:'flex',flexDirection:'column',gap:12}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start',gap:7,alignItems:'flex-start'}}>
            {m.role==='ai'&&<EPAvatar size={22} iconSize={11} teal={t.teal} bg={t.tealIconBg}/>}
            <div style={{maxWidth:'72%',background:m.role==='ai'?t.card:`linear-gradient(135deg,${t.teal22},${t.tealDark11})`,
              border:`0.67px solid ${m.role==='ai'?t.border:t.borderStrong}`,
              borderRadius:m.role==='ai'?'3px 14px 14px 14px':'14px 14px 3px 14px',
              padding:'8px 11px',fontSize:13,lineHeight:1.6,color:t.textMid}}>
              {m.text}
            </div>
          </div>
        ))}
        {typing&&(
          <div style={{display:'flex',gap:7,alignItems:'flex-start'}}>
            <EPAvatar size={22} iconSize={11} teal={t.teal} bg={t.tealIconBg}/>
            <div style={{background:t.card,border:`0.67px solid ${t.border}`,borderRadius:'3px 14px 14px 14px',
              padding:'8px 11px',display:'flex',gap:3,alignItems:'center'}}>
              {[0,.2,.4].map((d,i)=>(
                <div key={i} style={{width:5,height:5,borderRadius:'50%',background:t.teal,animation:`typingBounce 1s ${d}s infinite`}}/>
              ))}
            </div>
          </div>
        )}
      </div>
      {/* Suggestions */}
      <div style={{padding:'6px 12px 4px',borderTop:`1px solid ${t.border}`,display:'flex',gap:5,flexWrap:'wrap'}}>
        {['Pipeline summary','Top candidates','Draft offer email'].map(s=>(
          <button key={s} onClick={()=>send(s)}
            style={{padding:'3px 9px',borderRadius:50,background:t.tealIconBg,border:`1px solid ${t.border}`,
              color:t.teal,fontSize:11,cursor:'pointer',fontFamily:'inherit'}}>&#10022; {s}</button>
        ))}
      </div>
      {/* Input */}
      <div style={{padding:'6px 12px 12px',borderTop:`1px solid ${t.border}`}}>
        <div style={{display:'flex',gap:8,alignItems:'center',background:t.inputBg,
          border:`1px solid ${t.inputBorder}`,borderRadius:18,padding:'7px 10px 7px 14px'}}>
          <input value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();send();}}}
            placeholder="Ask Eddie..."
            style={{flex:1,background:'transparent',border:'none',outline:'none',

          <button onClick={()=>send()}
            style={{width:28,height:28,borderRadius:'50%',border:'none',cursor:input?'pointer':'default',
              background:input?`linear-gradient(135deg,${t.teal},${t.tealDark})`:t.pillBg,
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke={input?'#0A1214':t.grayDim} strokeWidth="2.5">
              <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  );
}

             onMouseLeave={e=>e.target.style.color=t.gray}>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
